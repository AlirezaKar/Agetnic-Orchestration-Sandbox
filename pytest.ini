[pytest]
pythonpath = .
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
asyncio_default_test_loop_scope = function
testpaths = tests
addopts = -q
filterwarnings =
    ignore:'asyncio\.(get|set)_event_loop_policy' is deprecated:DeprecationWarning:pytest_asyncio\.plugin
    ignore:Using `httpx` with `starlette\.testclient` is deprecated:DeprecationWarning:(fastapi|starlette)\.testclient
